plugins {
	id 'com.android.application'
}

// The TT9 application shell. The keyboard itself (all of app/src/{main,full,lite,premium}) is compiled by the
// :ime-lib library module, which Revenant Lite consumes too; this module only adds identity, version, signing
// and the launcher (app/src/app/AndroidManifest.xml).
apply from: 'constants.gradle'
apply from: 'version-tools.gradle'

def getVerCode = { -> return getVersionCode() }
def getVerName = { -> return getVersionName() }

android {
	namespace = "${PACKAGE_NAME}.app"   // distinct from the library's: two modules may not share a namespace
	compileSdk = (project.findProperty('tt9CompileSdk') ?: 37) as int   // mesh-tt9: -Ptt9CompileSdk=35 builds where SDK 37 is unavailable

	defaultConfig {
		applicationId = PACKAGE_NAME   // unchanged: io.github.sspanak.tt9
		minSdk = 24
		targetSdk = (project.findProperty('tt9TargetSdk') ?: 37) as int
		versionCode = getVerCode()
		versionName = getVerName()

		// F-droid hacks
		dependenciesInfo.includeInApk = false
		vectorDrawables.generatedDensities = []
	}

	buildFeatures {
		buildConfig = false
	}

	buildTypes {
		release {
			debuggable = false
			jniDebuggable = false
			minifyEnabled = true
			shrinkResources = true
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
		}
	}
	compileOptions {
		sourceCompatibility JavaVersion.VERSION_17
		targetCompatibility JavaVersion.VERSION_17
	}

	flavorDimensions = ['app']
	productFlavors {
		full { dimension 'app' }
		lite { dimension 'app' }
		premium { dimension 'app' }
	}

	// app/src/{main,full,lite,premium} belong to :ime-lib; compiling them here too would define every class twice.
	// Only the manifest (launcher + identity) is this module's own.
	sourceSets {
		configureEach {
			java.srcDirs = []
			res.srcDirs = []
			assets.srcDirs = []
		}
		main.manifest.srcFile 'src/app/AndroidManifest.xml'
	}

	androidComponents {
		onVariants(selector().all()) { variant ->
			def variantName = variant.name.capitalize()

			tasks.matching { it.name == "assemble${variantName}" }.configureEach {
				finalizedBy(updateManifest)
			}

			variant.outputs.forEach { output ->
				def fullSuffix = variant.flavorName == 'full' ? '-full' : ''
				def debugSuffix = variant.name.containsIgnoreCase('debug') ? '-debug' : ''

				output.outputFileName.set(
					"${APP_NAME}-v${getVerName()}${fullSuffix}${debugSuffix}.apk"
				)
			}
		}
	}
}

tasks.register('updateManifest') {
	doLast {
		updateManifestVersion(getVersionCode(), getVersionName())
	}
}

dependencies {
	implementation project(':ime-lib')
}
